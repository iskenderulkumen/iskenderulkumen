# Katkı haritasını tarayan drone animasyonunu üretir.
# Her gün otomatik çalışır, sonucu "output" dalına koyar.
name: Drone tarama animasyonu

on:
  schedule:
    - cron: "0 0 * * *"   # her gün 00:00 (UTC)
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [main]

permissions:
  contents: write          # output dalına dosya yazabilmesi için

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Drone tarama SVG'sini üret
        run: python3 scripts/drone_scan.py "${{ github.repository_owner }}" dist/drone-scan.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: output dalına gönder
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
