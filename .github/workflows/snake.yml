# Katkı grafiğinden yılan animasyonu üretir.
# Her gün otomatik çalışır, sonucu "output" dalına koyar.
name: Yılan animasyonu

on:
  schedule:
    - cron: "0 0 * * *"   # her gün 00:00 (UTC)
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [main]

permissions:
  contents: write          # output dalına dosya yazabilmesi için

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Yılan SVG'lerini üret
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: output dalına gönder
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
