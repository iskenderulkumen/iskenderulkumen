<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210">
  <defs>
    <!-- FONT: Audiowide (Astigmatic, SIL OFL 1.1, lisans: Audiowide-OFL.txt). Bu, adı değiştirilmiş bir alt kümesidir.
         GitHub resimlerin dışarıdan font indirmesine izin vermez, bu yüzden font dosyası
         base64 metne çevrilip doğrudan buraya gömüldü. Sadece banner'daki harfleri içerir (~5 KB). -->
    <style>
      @font-face { font-family: "AW"; src: url(data:font/woff;base64,) format("woff"); }
      .aw { font-family: "AW", sans-serif; }
    </style>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Neon tüp efekti: iki farklı genişlikte parlama üst üste -->
    <filter id="neon" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05010d"/>
      <stop offset="0.5" stop-color="#1e0636"/>
      <stop offset="1" stop-color="#3a0a52"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#000" fill-opacity="0.3"/></pattern>
    <clipPath id="panel"><rect width="800" height="210" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="800" height="210" fill="url(#bg)"/>

    <!-- Yıldızlar: farklı hızlarda göz kırpar -->
    <g fill="#fff">
      <circle cx="60" cy="40" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="90" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="30" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="590" cy="35" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="80" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="745" cy="45" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="20" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Alt kısımda ileri akan perspektif ızgara -->
    <g stroke="#ff2bd6" stroke-opacity="0.45" filter="url(#glow)">
      <line x1="0" y1="170" x2="800" y2="170" stroke-opacity="0.8"/>
      <line x1="400" y1="170" x2="-200" y2="210"/><line x1="400" y1="170" x2="0" y2="210"/>
      <line x1="400" y1="170" x2="200" y2="210"/><line x1="400" y1="170" x2="400" y2="210"/>
      <line x1="400" y1="170" x2="600" y2="210"/><line x1="400" y1="170" x2="800" y2="210"/>
      <line x1="400" y1="170" x2="1000" y2="210"/>
      <line x1="0" x2="800" y1="170" y2="170"><animate attributeName="y1" values="170;210" dur="1.6s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="170;210" dur="1.6s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/></line>
      <line x1="0" x2="800" y1="170" y2="170"><animate attributeName="y1" values="170;210" dur="1.6s" begin="-0.8s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="170;210" dur="1.6s" begin="-0.8s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/></line>
    </g>

    <!-- Köşe bilgileri -->
    <g class="aw" font-size="11" fill="#9d4edd" letter-spacing="2">
      <text x="24" y="30">SAKARYA // TR</text>
      <text x="776" y="30" text-anchor="end">40.74°N 30.33°E</text>
    </g>

    <!-- ===== İSİM ===== -->
    <g class="aw" font-size="68" text-anchor="middle" letter-spacing="6">
      <!-- Glitch katmanları: ara sıra yana kayar -->
      <text x="400" y="112" fill="#ff2bd6" opacity="0.7">İSKENDER
        <animateTransform attributeName="transform" type="translate" values="0 0;-6 2;4 -1;0 0" keyTimes="0;0.9;0.93;0.96" calcMode="discrete" dur="4s" repeatCount="indefinite"/></text>
      <text x="400" y="112" fill="#00f0ff" opacity="0.7">İSKENDER
        <animateTransform attributeName="transform" type="translate" values="0 0;6 -2;-4 1;0 0" keyTimes="0;0.9;0.93;0.96" calcMode="discrete" dur="4s" repeatCount="indefinite"/></text>
      <!-- Asıl yazı: neon tüp gibi parlar, arada bozuk tabela gibi titrer -->
      <text x="400" y="112" fill="#e9fdff" stroke="#00f0ff" stroke-width="1.5" filter="url(#neon)">İSKENDER
        <animate attributeName="opacity" values="1;1;0.35;1;0.6;1;1" keyTimes="0;0.55;0.56;0.58;0.59;0.61;1" dur="6s" repeatCount="indefinite"/></text>
    </g>

    <!-- ===== Alt yazı ve iki yanındaki ışıklı çizgiler ===== -->
    <text class="aw" x="400" y="148" font-size="15" fill="#ff2bd6" text-anchor="middle" letter-spacing="4" filter="url(#glow)">VERİ BİLİMİ × İHA YAZILIMI</text>
    <g>
      <line x1="90" y1="143" x2="210" y2="143" stroke="#ff2bd6" stroke-opacity="0.3"/>
      <line x1="590" y1="143" x2="710" y2="143" stroke="#ff2bd6" stroke-opacity="0.3"/>
      <rect y="142" width="40" height="2" fill="url(#fade)" filter="url(#glow)"><animate attributeName="x" values="90;170;90" dur="3s" repeatCount="indefinite"/></rect>
      <rect y="142" width="40" height="2" fill="url(#fade)" filter="url(#glow)"><animate attributeName="x" values="670;590;670" dur="3s" repeatCount="indefinite"/></rect>
    </g>

    <rect width="800" height="210" fill="url(#scan)"/>
  </g>
</svg>
