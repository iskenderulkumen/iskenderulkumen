<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="200" viewBox="0 0 800 200" font-family="monospace">
  <defs>
    <!-- Tek bir mini drone. Aşağıda 5 kez kopyalanıyor (<use>). -->
    <g id="mini">
      <rect x="-20" y="-2" width="40" height="4" rx="2" fill="#8b949e"/>
      <rect x="-8" y="-6" width="16" height="11" rx="4" fill="#36BCF7"/>
      <ellipse cx="-20" cy="-6" rx="11" ry="1.8" fill="#36BCF7" opacity="0.8"><animate attributeName="rx" values="11;2;11" dur="0.1s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="20" cy="-6" rx="11" ry="1.8" fill="#36BCF7" opacity="0.8"><animate attributeName="rx" values="2;11;2" dur="0.1s" repeatCount="indefinite"/></ellipse>
      <circle cx="0" cy="8" r="2" fill="#3fb950"><animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/></circle>
    </g>
  </defs>

  <!-- Formasyon sırası: ÇİZGİ → V → BEŞGEN → ÇİZGİ (12 saniyelik döngü).
       values = her anahtar karedeki konum, keyTimes = o karenin zamanı (0-1). -->

  <g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite"
      values="200 100; 200 100; 260 140; 260 140; 343 82; 343 82; 200 100"
      keyTimes="0;0.15;0.33;0.48;0.66;0.81;1" calcMode="spline"
      keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <use href="#mini" xlink:href="#mini"/></g>

  <g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite"
      values="300 100; 300 100; 330 100; 330 100; 365 149; 365 149; 300 100"
      keyTimes="0;0.15;0.33;0.48;0.66;0.81;1" calcMode="spline"
      keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <use href="#mini" xlink:href="#mini"/></g>

  <g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite"
      values="400 100; 400 100; 400 60; 400 60; 400 40; 400 40; 400 100"
      keyTimes="0;0.15;0.33;0.48;0.66;0.81;1" calcMode="spline"
      keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <use href="#mini" xlink:href="#mini"/></g>

  <g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite"
      values="500 100; 500 100; 470 100; 470 100; 435 149; 435 149; 500 100"
      keyTimes="0;0.15;0.33;0.48;0.66;0.81;1" calcMode="spline"
      keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <use href="#mini" xlink:href="#mini"/></g>

  <g><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite"
      values="600 100; 600 100; 540 140; 540 140; 457 82; 457 82; 600 100"
      keyTimes="0;0.15;0.33;0.48;0.66;0.81;1" calcMode="spline"
      keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <use href="#mini" xlink:href="#mini"/></g>

  <!-- Formasyon adı: o an hangi şekildeyse o yazı görünür -->
  <g fill="#8b949e" font-size="13" text-anchor="middle">
    <text x="400" y="192" opacity="0">SÜRÜ MODU: ÇİZGİ<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.24;0.9" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="400" y="192" opacity="0">SÜRÜ MODU: V<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.24;0.57" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="400" y="192" opacity="0">SÜRÜ MODU: BEŞGEN<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.57;0.9" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
  </g>
</svg>
