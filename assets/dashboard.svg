<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="330" viewBox="0 0 800 330" font-family="monospace">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="line" x1="40" y1="0" x2="370" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.35"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="70" x2="0" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2bd6"/><stop offset="0.5" stop-color="#9d4edd"/><stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Çubukları ekolayzır gibi dilimlere bölen maske -->
    <pattern id="segP" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="4" fill="#fff"/></pattern>
    <mask id="seg"><rect x="410" y="60" width="370" height="110" fill="url(#segP)"/></mask>
    <!-- Arka plandaki nokta ızgara -->
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#9d4edd" fill-opacity="0.25"/></pattern>
    <clipPath id="logbox"><rect x="30" y="215" width="350" height="92"/></clipPath>
    <clipPath id="panel"><rect width="800" height="330" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="800" height="330" fill="#07010f"/>
    <rect width="800" height="330" fill="url(#dots)"/>

    <!-- ===== Başlık ===== -->
    <g font-size="15" font-weight="bold">
      <text x="20" y="28" fill="#ff2bd6">FLIGHT_DATA.SYS<animateTransform attributeName="transform" type="translate" values="0 0;-4 1;2 0;0 0" keyTimes="0;0.88;0.92;0.96" calcMode="discrete" dur="4s" repeatCount="indefinite"/></text>
      <text x="20" y="28" fill="#00f0ff">FLIGHT_DATA.SYS<animateTransform attributeName="transform" type="translate" values="0 0;4 -1;-2 0;0 0" keyTimes="0;0.88;0.92;0.96" calcMode="discrete" dur="4s" repeatCount="indefinite"/></text>
      <text x="20" y="28" fill="#fff">FLIGHT_DATA.SYS</text>
    </g>
    <text x="780" y="27" fill="#ff2bd6" font-size="12" text-anchor="end" filter="url(#glow)">● CANLI<animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></text>
    <!-- Başlık çizgisi ve üzerinde kayan ışık -->
    <line x1="20" y1="38" x2="780" y2="38" stroke="url(#edge)" stroke-opacity="0.6"/>
    <rect y="37" width="90" height="2" fill="url(#shine)" filter="url(#glow)">
      <animate attributeName="x" values="-90;800" dur="3s" repeatCount="indefinite"/></rect>

    <!-- ===== Köşesi kesik paneller ===== -->
    <g fill="#0a0118" fill-opacity="0.85" stroke="url(#edge)" stroke-opacity="0.8" filter="url(#glow)">
      <path d="M32 48 H390 V171 L378 183 H20 V60 Z"/>
      <path d="M422 48 H780 V171 L768 183 H410 V60 Z"/>
      <path d="M32 195 H390 V303 L378 315 H20 V207 Z"/>
      <path d="M422 195 H780 V303 L768 315 H410 V207 Z"/>
    </g>
    <g fill="#00f0ff" font-size="10" font-weight="bold">
      <text x="34" y="64">// İRTİFA_m</text>
      <text x="424" y="64">// SENSÖR_SPEKTRUMU</text>
      <text x="34" y="211">// UÇUŞ_KAYDI</text>
      <text x="424" y="211">// SİSTEM_DURUMU</text>
    </g>

    <!-- ===== 1) Neon çizgi grafik ===== -->
    <g stroke="#9d4edd" stroke-opacity="0.25"><line x1="40" y1="95" x2="370" y2="95"/><line x1="40" y1="125" x2="370" y2="125"/><line x1="40" y1="155" x2="370" y2="155"/></g>
    <path d="M40 160 C80 160 100 100 140 95 S200 110 230 92 S290 72 320 82 S360 76 370 74 L370 172 L40 172 Z" fill="url(#area)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.7;0.95;1" dur="5s" repeatCount="indefinite"/></path>
    <!-- pathLength=1 → dashoffset 1'den 0'a = çizgi baştan sona çizilir -->
    <path id="alt" d="M40 160 C80 160 100 100 140 95 S200 110 230 92 S290 72 320 82 S360 76 370 74" pathLength="1"
          fill="none" stroke="url(#line)" stroke-width="2.5" stroke-dasharray="1 1" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.6;0.95;1" dur="5s" repeatCount="indefinite"/></path>
    <!-- Çizginin ucundaki parlayan nokta: aynı zamanlamayla yolu izler -->
    <circle r="4" fill="#fff" filter="url(#glow2)">
      <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;0.6;0.95;1" calcMode="linear"><mpath href="#alt" xlink:href="#alt"/></animateMotion></circle>
    <text x="370" y="64" fill="#ff2bd6" font-size="12" font-weight="bold" text-anchor="end" opacity="0" filter="url(#glow)">74m
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;0.95" calcMode="discrete" dur="5s" repeatCount="indefinite"/></text>

    <!-- ===== 2) Ekolayzır çubukları (taban y=165) ===== -->
    <g fill="url(#bar)" mask="url(#seg)" filter="url(#glow)">
      <rect x="430" width="30"><animate attributeName="height" values="40;85;30;70;40" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="125;80;135;95;125" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="472" width="30"><animate attributeName="height" values="70;45;90;55;70" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="95;120;75;110;95" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="514" width="30"><animate attributeName="height" values="55;90;65;35;55" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="110;75;100;130;110" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="556" width="30"><animate attributeName="height" values="85;60;40;80;85" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="80;105;125;85;80" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="598" width="30"><animate attributeName="height" values="35;70;90;50;35" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="130;95;75;115;130" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="640" width="30"><animate attributeName="height" values="60;40;75;95;60" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="105;125;90;70;105" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="682" width="30"><animate attributeName="height" values="80;95;50;65;80" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="85;70;115;100;85" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="724" width="30"><animate attributeName="height" values="45;65;85;40;45" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="120;100;80;125;120" dur="1.2s" repeatCount="indefinite"/></rect>
    </g>

    <!-- ===== 3) Kayan uçuş kaydı (8 satır x 15px = 120px, iki kopya → kesintisiz) ===== -->
    <g clip-path="url(#logbox)" font-size="11">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -120" dur="10s" repeatCount="indefinite"/>
        <g id="log">
          <text x="34" y="232"><tspan fill="#39ff88">[OK]  </tspan><tspan fill="#e6e6ff"> GPS 3D fix, 14 uydu</tspan></text>
          <text x="34" y="247"><tspan fill="#00f0ff">[INFO]</tspan><tspan fill="#e6e6ff"> Görev yüklendi: 7 waypoint</tspan></text>
          <text x="34" y="262"><tspan fill="#39ff88">[OK]  </tspan><tspan fill="#e6e6ff"> EKF hazır</tspan></text>
          <text x="34" y="277"><tspan fill="#00f0ff">[INFO]</tspan><tspan fill="#e6e6ff"> Kalkış, hedef irtifa 30m</tspan></text>
          <text x="34" y="292"><tspan fill="#00f0ff">[INFO]</tspan><tspan fill="#e6e6ff"> WP 2/7 ulaşıldı</tspan></text>
          <text x="34" y="307"><tspan fill="#ffe600">[WARN]</tspan><tspan fill="#e6e6ff"> Rüzgar 9 m/s</tspan></text>
          <text x="34" y="322"><tspan fill="#ff2bd6">[LOCK]</tspan><tspan fill="#e6e6ff"> Hedef kilitlendi: TGT-01</tspan></text>
          <text x="34" y="337"><tspan fill="#00f0ff">[INFO]</tspan><tspan fill="#e6e6ff"> Veri kaydı %62</tspan></text>
        </g>
        <use href="#log" xlink:href="#log" y="120"/>
      </g>
    </g>

    <!-- ===== 4) Neon göstergeler (pathLength=100 → dasharray'in ilk sayısı = yüzde) ===== -->
    <g fill="none">
      <!-- Dış halkalar yavaşça döner -->
      <g stroke="#9d4edd" stroke-opacity="0.6" stroke-dasharray="6 5">
        <circle cx="480" cy="256" r="37"><animateTransform attributeName="transform" type="rotate" from="0 480 256" to="360 480 256" dur="12s" repeatCount="indefinite"/></circle>
        <circle cx="595" cy="256" r="37"><animateTransform attributeName="transform" type="rotate" from="360 595 256" to="0 595 256" dur="12s" repeatCount="indefinite"/></circle>
        <circle cx="710" cy="256" r="37"><animateTransform attributeName="transform" type="rotate" from="0 710 256" to="360 710 256" dur="12s" repeatCount="indefinite"/></circle>
      </g>
      <g stroke="#1f1235" stroke-width="6"><circle cx="480" cy="256" r="28"/><circle cx="595" cy="256" r="28"/></g>
      <g stroke-width="6" stroke-linecap="round" filter="url(#glow)">
        <circle cx="480" cy="256" r="28" stroke="#00f0ff" pathLength="100" stroke-dasharray="87 100" transform="rotate(-90 480 256)">
          <animate attributeName="stroke-dasharray" values="0 100;87 100;87 100;85 100;87 100" keyTimes="0;0.2;0.6;0.8;1" dur="6s" repeatCount="indefinite"/></circle>
        <circle cx="595" cy="256" r="28" stroke="#ff2bd6" pathLength="100" stroke-dasharray="75 100" transform="rotate(-90 595 256)">
          <animate attributeName="stroke-dasharray" values="70 100;92 100;60 100;85 100;70 100" dur="3s" repeatCount="indefinite"/></circle>
      </g>
      <circle cx="710" cy="256" r="28" stroke="#ffe600" stroke-opacity="0.5" stroke-width="1.5"/>
    </g>
    <g font-size="12" font-weight="bold" text-anchor="middle" filter="url(#glow)">
      <text x="480" y="260" fill="#00f0ff">87%</text>
      <text x="595" y="260" fill="#ff2bd6">RSSI</text>
      <text x="710" y="237" fill="#ffe600" font-size="9">K</text>
    </g>
    <polygon points="710,234 715,256 710,262 705,256" fill="#ffe600" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="0 710 256;40 710 256;-25 710 256;10 710 256;0 710 256" dur="7s" repeatCount="indefinite"/></polygon>
    <g fill="#9d4edd" font-size="9" text-anchor="middle"><text x="480" y="306">BATARYA</text><text x="595" y="306">SİNYAL</text><text x="710" y="306">YÖN</text></g>
  </g>
</svg>
