<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" font-family="monospace">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
    </linearGradient>
    <!-- Log satırları bu kutunun dışına taşmasın -->
    <clipPath id="logbox"><rect x="30" y="206" width="350" height="86"/></clipPath>
  </defs>

  <!-- Ana panel -->
  <rect width="800" height="310" rx="14" fill="#0d1117"/>
  <text x="20" y="26" fill="#c9d1d9" font-size="14" font-weight="bold">UÇUŞ VERİ PANELİ</text>
  <text x="780" y="26" fill="#ff4d4d" font-size="12" text-anchor="end">● CANLI<animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></text>

  <!-- Alt paneller -->
  <g fill="#161b22">
    <rect x="20" y="40" width="370" height="140" rx="8"/>
    <rect x="410" y="40" width="370" height="140" rx="8"/>
    <rect x="20" y="190" width="370" height="108" rx="8"/>
    <rect x="410" y="190" width="370" height="108" rx="8"/>
  </g>
  <g fill="#8b949e" font-size="11">
    <text x="32" y="58">İRTİFA (m)</text>
    <text x="422" y="58">MOTOR RPM</text>
    <text x="32" y="206">UÇUŞ KAYDI</text>
    <text x="422" y="206">DURUM</text>
  </g>

  <!-- ===== 1) Çizgi grafik: kendini çizer, sonra baştan başlar ===== -->
  <g stroke="#30363d"><line x1="40" y1="90" x2="370" y2="90"/><line x1="40" y1="120" x2="370" y2="120"/><line x1="40" y1="150" x2="370" y2="150"/></g>
  <path d="M40 150 C80 150 100 90 140 85 S200 100 230 82 S290 62 320 72 S360 66 370 64 L370 165 L40 165 Z" fill="url(#area)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.7;0.95;1" dur="5s" repeatCount="indefinite"/>
  </path>
  <!-- pathLength="1": çizginin boyunu 1 kabul et. Böylece dashoffset 1→0 = "baştan sona çiz" -->
  <path d="M40 150 C80 150 100 90 140 85 S200 100 230 82 S290 62 320 72 S360 66 370 64" pathLength="1"
        fill="none" stroke="#36BCF7" stroke-width="2.5" stroke-dasharray="1 1">
    <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.6;0.95;1" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- ===== 2) Çubuk grafik: 4 motorun devri sürekli oynar =====
       Alt çizgi y=160. height büyüdükçe y küçülmeli ki çubuk yukarı uzasın. -->
  <g>
    <rect x="450" width="50" rx="4" fill="#36BCF7">
      <animate attributeName="height" values="60;85;55;75;60" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="100;75;105;85;100" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="530" width="50" rx="4" fill="#3fb950">
      <animate attributeName="height" values="80;60;90;65;80" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="80;100;70;95;80" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="610" width="50" rx="4" fill="#d29922">
      <animate attributeName="height" values="70;50;80;90;70" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="90;110;80;70;90" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="690" width="50" rx="4" fill="#a371f7">
      <animate attributeName="height" values="55;75;65;85;55" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="105;85;95;75;105" dur="2.1s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="#8b949e" font-size="11" text-anchor="middle">
    <text x="475" y="174">M1</text><text x="555" y="174">M2</text><text x="635" y="174">M3</text><text x="715" y="174">M4</text>
  </g>

  <!-- ===== 3) Kayan uçuş kaydı (terminal) =====
       8 satır x 15px = 120px. İki kopya alt alta, 120px yukarı kayınca başa döner → kesintisiz döngü. -->
  <g clip-path="url(#logbox)" font-size="11">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -120" dur="10s" repeatCount="indefinite"/>
      <g id="log">
        <text x="32" y="222"><tspan fill="#3fb950">[OK]  </tspan><tspan fill="#c9d1d9">GPS 3D fix, 14 uydu</tspan></text>
        <text x="32" y="237"><tspan fill="#36BCF7">[INFO]</tspan><tspan fill="#c9d1d9"> Görev yüklendi: 7 waypoint</tspan></text>
        <text x="32" y="252"><tspan fill="#3fb950">[OK]  </tspan><tspan fill="#c9d1d9">EKF hazır</tspan></text>
        <text x="32" y="267"><tspan fill="#36BCF7">[INFO]</tspan><tspan fill="#c9d1d9"> Kalkış, hedef irtifa 30m</tspan></text>
        <text x="32" y="282"><tspan fill="#36BCF7">[INFO]</tspan><tspan fill="#c9d1d9"> WP 2/7 ulaşıldı</tspan></text>
        <text x="32" y="297"><tspan fill="#d29922">[WARN]</tspan><tspan fill="#c9d1d9"> Rüzgar 9 m/s</tspan></text>
        <text x="32" y="312"><tspan fill="#3fb950">[OK]  </tspan><tspan fill="#c9d1d9">Hedef tespit: TGT-01</tspan></text>
        <text x="32" y="327"><tspan fill="#36BCF7">[INFO]</tspan><tspan fill="#c9d1d9"> Veri kaydı %62</tspan></text>
      </g>
      <use href="#log" y="120"/>
    </g>
  </g>

  <!-- ===== 4) Göstergeler ===== -->
  <!-- Daire göstergeler: pathLength="100" sayesinde dasharray'deki ilk sayı doğrudan yüzde -->
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <circle cx="480" cy="250" r="28" stroke="#30363d"/>
    <circle cx="480" cy="250" r="28" stroke="#3fb950" pathLength="100" stroke-dasharray="87 100" transform="rotate(-90 480 250)">
      <animate attributeName="stroke-dasharray" values="0 100;87 100;87 100;85 100;87 100" keyTimes="0;0.2;0.6;0.8;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="595" cy="250" r="28" stroke="#30363d"/>
    <circle cx="595" cy="250" r="28" stroke="#36BCF7" pathLength="100" stroke-dasharray="75 100" transform="rotate(-90 595 250)">
      <animate attributeName="stroke-dasharray" values="70 100;92 100;60 100;85 100;70 100" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="480" y="254" fill="#3fb950">87%</text>
    <text x="595" y="254" fill="#36BCF7">dBm</text>
    <g fill="#8b949e" font-size="10"><text x="480" y="292">BATARYA</text><text x="595" y="292">SİNYAL</text><text x="710" y="292">YÖN</text></g>
  </g>
  <!-- Pusula: ibre sağa sola döner -->
  <circle cx="710" cy="250" r="28" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="710" y="218" fill="#8b949e" font-size="9" text-anchor="middle">K</text>
  <polygon points="710,228 715,250 710,256 705,250" fill="#ff4d4d">
    <animateTransform attributeName="transform" type="rotate" values="0 710 250;40 710 250;-25 710 250;10 710 250;0 710 250" dur="7s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="710" cy="250" r="3" fill="#c9d1d9"/>
</svg>
