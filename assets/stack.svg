<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120" font-family="monospace">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="120" rx="14" fill="#07010f"/>

  <!-- Her çip sırayla parlar: aynı animasyon, farklı başlangıç (begin) zamanı → dalga efekti -->
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#glow)">
    <text x="20" y="44" fill="#9d4edd" font-size="11" text-anchor="start">// UÇUŞ</text>
    <g stroke="#00f0ff" fill="none">
      <rect x="100" y="25" width="100" height="28" rx="2"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="215" y="25" width="120" height="28" rx="2"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="0.3s" repeatCount="indefinite"/></rect>
      <rect x="350" y="25" width="100" height="28" rx="2"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect>
      <rect x="465" y="25" width="90" height="28" rx="2"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="0.9s" repeatCount="indefinite"/></rect>
      <rect x="570" y="25" width="70" height="28" rx="2"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#00f0ff"><text x="150" y="44">PYTHON</text><text x="275" y="44">ARDUPILOT</text><text x="400" y="44">MAVLINK</text><text x="510" y="44">LINUX</text><text x="605" y="44">GIT</text></g>

    <text x="20" y="89" fill="#9d4edd" font-size="11" text-anchor="start">// VERİ</text>
    <g stroke="#ff2bd6" fill="none">
      <rect x="100" y="70" width="70" height="28" rx="2"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect>
      <rect x="185" y="70" width="100" height="28" rx="2"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="1.8s" repeatCount="indefinite"/></rect>
      <rect x="300" y="70" width="90" height="28" rx="2"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="2.1s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#ff2bd6"><text x="135" y="89">SQL</text><text x="235" y="89">PANDAS</text><text x="345" y="89">NUMPY</text></g>
  </g>

  <!-- Sağda küçük sinyal/veri dalgası -->
  <path d="M670 60 l8 0 l6 -22 l8 44 l8 -34 l6 12 l8 0 l6 -8 l8 16 l6 -8 l12 0" fill="none" stroke="#ffe600" stroke-width="2" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="1;0;-1" dur="2.5s" repeatCount="indefinite"/>
  </path>
</svg>
