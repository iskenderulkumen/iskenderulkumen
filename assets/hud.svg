<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="monospace">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Panel arka planı (kendi rengi var, açık/koyu temada aynı görünür) -->
  <rect x="0" y="0" width="800" height="320" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="798" height="318" rx="14" fill="none" stroke="#3fb950" stroke-opacity="0.35"/>

  <!-- ================= SOL: RADAR ================= -->
  <g stroke="#3fb950" fill="none" stroke-opacity="0.5">
    <circle cx="160" cy="160" r="130"/>
    <circle cx="160" cy="160" r="87"/>
    <circle cx="160" cy="160" r="43"/>
    <line x1="30" y1="160" x2="290" y2="160"/>
    <line x1="160" y1="30" x2="160" y2="290"/>
  </g>

  <!-- Dönen tarama ışını: 4 saniyede bir tam tur -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" dur="4s" repeatCount="indefinite"/>
    <path d="M160 160 L290 160 A130 130 0 0 0 272.6 95 Z" fill="url(#sweep)"/>
    <line x1="160" y1="160" x2="290" y2="160" stroke="#3fb950" stroke-width="2"/>
  </g>

  <!-- Hedef noktaları: ışın üstlerinden geçtiği an parlayıp sönerler.
       begin = (açı / 360) * 4s  -->
  <g fill="#3fb950">
    <circle cx="229" cy="218" r="5" opacity="0"><animate attributeName="opacity" values="1;0" dur="4s" begin="0.44s" repeatCount="indefinite"/></circle>
    <circle cx="108" cy="190" r="5" opacity="0"><animate attributeName="opacity" values="1;0" dur="4s" begin="1.67s" repeatCount="indefinite"/></circle>
    <circle cx="122" cy="57"  r="5" opacity="0"><animate attributeName="opacity" values="1;0" dur="4s" begin="2.78s" repeatCount="indefinite"/></circle>
    <circle cx="214" cy="115" r="5" opacity="0" fill="#ff4d4d"><animate attributeName="opacity" values="1;0" dur="4s" begin="3.56s" repeatCount="indefinite"/></circle>
  </g>
  <text x="160" y="310" fill="#3fb950" font-size="12" text-anchor="middle">RADAR // 4 TEMAS</text>

  <!-- ================= SAĞ: TAKİP KAMERASI ================= -->
  <!-- Köşe çerçeveleri -->
  <path d="M340 50 V30 H370 M750 30 H780 V50 M780 270 V290 H750 M370 290 H340 V270" stroke="#36BCF7" stroke-width="2" fill="none"/>
  <!-- Orta nişangah -->
  <g stroke="#36BCF7" stroke-opacity="0.6">
    <line x1="545" y1="160" x2="575" y2="160"/>
    <line x1="560" y1="145" x2="560" y2="175"/>
    <circle cx="560" cy="160" r="40" fill="none" stroke-dasharray="4 6"/>
  </g>

  <!-- Aşağı kayan tarama çizgisi -->
  <line x1="340" x2="780" y1="30" y2="30" stroke="#36BCF7" stroke-opacity="0.25" stroke-width="2">
    <animate attributeName="y1" values="30;290" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="30;290" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Hedef drone: kıvrımlı bir rota boyunca uçar -->
  <g>
    <animateMotion dur="7s" repeatCount="indefinite"
      path="M560 160 C640 70 740 120 700 200 S520 270 450 190 S470 90 560 160 Z"/>
    <g fill="#c9d1d9">
      <rect x="-18" y="-2" width="36" height="4" rx="2"/>
      <rect x="-7" y="-5" width="14" height="9" rx="3"/>
      <ellipse cx="-18" cy="-6" rx="9" ry="1.6"><animate attributeName="rx" values="9;2;9" dur="0.1s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="18" cy="-6" rx="9" ry="1.6"><animate attributeName="rx" values="2;9;2" dur="0.1s" repeatCount="indefinite"/></ellipse>
    </g>
  </g>

  <!-- Kilit kutusu: aynı rotayı izler, yani hedefe yapışık kalır -->
  <g>
    <animateMotion dur="7s" repeatCount="indefinite"
      path="M560 160 C640 70 740 120 700 200 S520 270 450 190 S470 90 560 160 Z"/>
    <g stroke="#ff4d4d" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="0.6s" repeatCount="indefinite"/>
      <path d="M-30 -12 V-22 H-20 M20 -22 H30 V-12 M30 12 V22 H20 M-20 22 H-30 V12"/>
    </g>
    <text x="-30" y="-28" fill="#ff4d4d" font-size="11">TGT-01</text>
  </g>

  <!-- Üst yazılar -->
  <text x="352" y="22" fill="#ff4d4d" font-size="12">● REC<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></text>
  <text x="772" y="22" fill="#ff4d4d" font-size="12" text-anchor="end">HEDEF KİLİTLENDİ<animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></text>

  <!-- Alt telemetri: irtifa değeri sırayla değişir -->
  <text x="352" y="310" fill="#36BCF7" font-size="12">İRT:</text>
  <g fill="#36BCF7" font-size="12">
    <text x="386" y="310" opacity="0">118m<animate attributeName="opacity" values="1;0;0;0" dur="2s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="386" y="310" opacity="0">121m<animate attributeName="opacity" values="0;1;0;0" dur="2s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="386" y="310" opacity="0">124m<animate attributeName="opacity" values="0;0;1;0" dur="2s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="386" y="310" opacity="0">122m<animate attributeName="opacity" values="0;0;0;1" dur="2s" calcMode="discrete" repeatCount="indefinite"/></text>
  </g>
  <text x="450" y="310" fill="#36BCF7" font-size="12">HIZ: 14 m/s   MOD: AUTO   BAT: 87%</text>
</svg>
