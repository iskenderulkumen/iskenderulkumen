<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="monospace">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <!-- CRT tarama çizgisi deseni: her 4px'te bir koyu çizgi -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <clipPath id="panel"><rect width="800" height="330" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="800" height="330" fill="#07010f"/>

    <!-- ================= SOL: NEON RADAR ================= -->
    <g fill="none" stroke="#00f0ff">
      <circle cx="165" cy="170" r="130" stroke-width="2" filter="url(#glow)"/>
      <g stroke-opacity="0.3"><circle cx="165" cy="170" r="95"/><circle cx="165" cy="170" r="60"/><circle cx="165" cy="170" r="25"/>
        <line x1="35" y1="170" x2="295" y2="170"/><line x1="165" y1="40" x2="165" y2="300"/></g>
      <!-- Derece çentikleri: pathLength=360, her 10 derecede 1 çentik -->
      <circle cx="165" cy="170" r="137" stroke-width="6" stroke-opacity="0.5" pathLength="360" stroke-dasharray="1 9"/>
      <!-- Ters yöne yavaş dönen kesikli dış halka -->
      <circle cx="165" cy="170" r="147" stroke="#ff2bd6" stroke-opacity="0.6" stroke-dasharray="30 14 4 14">
        <animateTransform attributeName="transform" type="rotate" from="360 165 170" to="0 165 170" dur="24s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Tarama ışını: üst üste 3 dilim → kuyruğa doğru solan iz -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 165 170" to="360 165 170" dur="4s" repeatCount="indefinite"/>
      <g fill="#ff2bd6" fill-opacity="0.13">
        <path d="M165 170 L295 170 A130 130 0 0 0 264.6 86.4 Z"/>
        <path d="M165 170 L295 170 A130 130 0 0 0 282.8 115.1 Z"/>
        <path d="M165 170 L295 170 A130 130 0 0 0 293 147.4 Z"/>
      </g>
      <line x1="165" y1="170" x2="295" y2="170" stroke="#ff2bd6" stroke-width="2.5" filter="url(#glow)"/>
    </g>

    <!-- Temaslar: ışın geçince yanar ve halka saçar. begin = (açı/360) x 4s -->
    <g filter="url(#glow)">
      <g opacity="0"><animate attributeName="opacity" values="1;0" dur="4s" begin="0.44s" repeatCount="indefinite"/>
        <circle cx="234" cy="228" r="4" fill="#00f0ff"/><circle cx="234" cy="228" r="4" fill="none" stroke="#00f0ff"><animate attributeName="r" values="4;16" dur="4s" begin="0.44s" repeatCount="indefinite"/></circle></g>
      <g opacity="0"><animate attributeName="opacity" values="1;0" dur="4s" begin="1.67s" repeatCount="indefinite"/>
        <circle cx="113" cy="200" r="4" fill="#00f0ff"/><circle cx="113" cy="200" r="4" fill="none" stroke="#00f0ff"><animate attributeName="r" values="4;16" dur="4s" begin="1.67s" repeatCount="indefinite"/></circle></g>
      <g opacity="0"><animate attributeName="opacity" values="1;0" dur="4s" begin="2.78s" repeatCount="indefinite"/>
        <circle cx="127" cy="67" r="4" fill="#00f0ff"/><circle cx="127" cy="67" r="4" fill="none" stroke="#00f0ff"><animate attributeName="r" values="4;16" dur="4s" begin="2.78s" repeatCount="indefinite"/></circle></g>
      <g opacity="0"><animate attributeName="opacity" values="1;0.15" dur="4s" begin="3.56s" repeatCount="indefinite"/>
        <circle cx="219" cy="125" r="5" fill="#ffe600"/><circle cx="219" cy="125" r="5" fill="none" stroke="#ffe600"><animate attributeName="r" values="5;20" dur="4s" begin="3.56s" repeatCount="indefinite"/></circle>
        <text x="228" y="120" fill="#ffe600" font-size="10">TGT-01</text></g>
    </g>
    <circle cx="165" cy="170" r="3" fill="#ff2bd6" filter="url(#glow2)"/>
    <text x="165" y="322" fill="#00f0ff" font-size="11" text-anchor="middle" filter="url(#glow)">RADAR_SYS // 4 TEMAS</text>

    <!-- ================= SAĞ: TAKİP EKRANI ================= -->
    <g>
      <!-- Ara sıra tüm ekran titrer (glitch) -->
      <animateTransform attributeName="transform" type="translate" values="0 0;5 0;-3 0;0 0" keyTimes="0;0.9;0.93;0.96" calcMode="discrete" dur="5s" repeatCount="indefinite"/>

      <!-- Köşesi kesik çerçeve -->
      <path d="M355 38 H785 V290 L770 305 H340 V53 Z" fill="#0a0118" stroke="url(#edge)" stroke-width="1.5" filter="url(#glow)"/>

      <!-- Nişangah -->
      <g stroke="#00f0ff" stroke-opacity="0.5" fill="none">
        <line x1="540" y1="171" x2="580" y2="171"/><line x1="560" y1="151" x2="560" y2="191"/>
        <circle cx="560" cy="171" r="55" stroke-dasharray="2 8"/>
        <circle cx="560" cy="171" r="100" stroke-opacity="0.2"/>
      </g>

      <!-- Hedef drone -->
      <g>
        <animateMotion dur="7s" repeatCount="indefinite" path="M560 165 C640 75 740 125 700 205 S520 275 450 195 S470 95 560 165 Z"/>
        <g fill="none" stroke="#ffffff" stroke-width="1.8" filter="url(#glow)">
          <line x1="-18" y1="0" x2="18" y2="0"/>
          <rect x="-7" y="-5" width="14" height="9" rx="3" fill="#0a0118"/>
          <ellipse cx="-18" cy="-5" rx="9" ry="1.5" stroke="#00f0ff"><animate attributeName="rx" values="9;2;9" dur="0.1s" repeatCount="indefinite"/></ellipse>
          <ellipse cx="18" cy="-5" rx="9" ry="1.5" stroke="#00f0ff"><animate attributeName="rx" values="2;9;2" dur="0.1s" repeatCount="indefinite"/></ellipse>
        </g>
      </g>

      <!-- Kilit retikülü: hedefle aynı rotada, kendi etrafında döner -->
      <g>
        <animateMotion dur="7s" repeatCount="indefinite" path="M560 165 C640 75 740 125 700 205 S520 275 450 195 S470 95 560 165 Z"/>
        <g filter="url(#glow)">
          <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#ff2bd6" stroke-width="1.5" stroke-dasharray="12 6">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></polygon>
          <path d="M-38 -26 V-36 H-28 M28 -36 H38 V-26 M38 26 V36 H28 M-28 36 H-38 V26" fill="none" stroke="#ffe600" stroke-width="2"/>
          <text x="44" y="-24" fill="#ffe600" font-size="10">TGT-01</text>
          <text x="44" y="-12" fill="#ff2bd6" font-size="10">MSF 248m</text>
        </g>
      </g>

      <!-- Üst: glitch başlık + kilit ilerleme çubuğu -->
      <g font-size="13" font-weight="bold">
        <text x="356" y="28" fill="#ff2bd6">TRACK_MODE<animateTransform attributeName="transform" type="translate" values="0 0;-3 0;0 0" keyTimes="0;0.9;0.95" calcMode="discrete" dur="3s" repeatCount="indefinite"/></text>
        <text x="356" y="28" fill="#00f0ff">TRACK_MODE<animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" keyTimes="0;0.9;0.95" calcMode="discrete" dur="3s" repeatCount="indefinite"/></text>
        <text x="356" y="28" fill="#fff">TRACK_MODE</text>
      </g>
      <rect x="560" y="18" width="120" height="10" fill="none" stroke="#ff2bd6" stroke-opacity="0.6"/>
      <rect x="562" y="20" height="6" fill="#ff2bd6" filter="url(#glow)">
        <animate attributeName="width" values="0;116;116;0" keyTimes="0;0.4;0.97;1" dur="6s" repeatCount="indefinite"/></rect>
      <g font-size="11" font-weight="bold" text-anchor="end" filter="url(#glow)">
        <text x="785" y="28" fill="#ffe600" opacity="0">KİLİTLENİYOR<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.4;0.97" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
        <text x="785" y="28" fill="#ff2bd6" opacity="0">KİLİTLENDİ<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;0.97" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
      </g>

      <!-- Alt telemetri -->
      <g font-size="11" fill="#00f0ff" filter="url(#glow)">
        <text x="356" y="322">İRT</text>
        <text x="384" y="322" opacity="0">118m<animate attributeName="opacity" values="1;0;0;0" dur="2s" calcMode="discrete" repeatCount="indefinite"/></text>
        <text x="384" y="322" opacity="0">121m<animate attributeName="opacity" values="0;1;0;0" dur="2s" calcMode="discrete" repeatCount="indefinite"/></text>
        <text x="384" y="322" opacity="0">124m<animate attributeName="opacity" values="0;0;1;0" dur="2s" calcMode="discrete" repeatCount="indefinite"/></text>
        <text x="384" y="322" opacity="0">122m<animate attributeName="opacity" values="0;0;0;1" dur="2s" calcMode="discrete" repeatCount="indefinite"/></text>
        <text x="440" y="322">HIZ 14m/s</text>
        <text x="530" y="322" fill="#ff2bd6">MOD AUTO</text>
        <text x="785" y="322" fill="#ff2bd6" text-anchor="end">● REC<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></text>
      </g>

      <!-- Glitch şeridi: ara sıra ekranda yatay bir pembe parazit belirir -->
      <rect x="340" width="445" height="6" fill="#ff2bd6" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0;0.35;0" keyTimes="0;0.9;0.92;0.95;0.97" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="120;120;230;230;120" keyTimes="0;0.9;0.92;0.95;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- En üstte CRT tarama çizgileri katmanı -->
    <rect width="800" height="330" fill="url(#scan)"/>
  </g>
</svg>
