<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170" font-family="monospace">
  <defs>
    <!-- Alttaki kayan 0/1 şeridi bu alanın dışına taşmasın -->
    <clipPath id="strip"><rect x="0" y="140" width="800" height="30"/></clipPath>
  </defs>

  <!-- Drone'dan yer istasyonuna giden veri yolu -->
  <path id="link" d="M130 70 Q400 0 670 80" fill="none" stroke="#8b949e" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- ===== Drone (sol) ===== -->
  <g transform="translate(90 75)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="1.8s" repeatCount="indefinite"/>
      <!-- Anten sinyal halkaları: sırayla büyüyüp kaybolur -->
      <g fill="none" stroke="#36BCF7">
        <circle cx="0" cy="-20" r="6"><animate attributeName="r" values="6;34" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.5s" repeatCount="indefinite"/></circle>
        <circle cx="0" cy="-20" r="6"><animate attributeName="r" values="6;34" dur="1.5s" begin="-0.75s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.5s" begin="-0.75s" repeatCount="indefinite"/></circle>
      </g>
      <ellipse cx="-40" cy="-14" rx="20" ry="3" fill="#36BCF7" opacity="0.8"><animate attributeName="rx" values="20;3;20" dur="0.12s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="40" cy="-14" rx="20" ry="3" fill="#36BCF7" opacity="0.8"><animate attributeName="rx" values="3;20;3" dur="0.12s" repeatCount="indefinite"/></ellipse>
      <rect x="-42" y="-13" width="4" height="7" fill="#8b949e"/>
      <rect x="38" y="-13" width="4" height="7" fill="#8b949e"/>
      <rect x="-44" y="-7" width="88" height="5" rx="2.5" fill="#8b949e"/>
      <rect x="-16" y="-12" width="32" height="16" rx="6" fill="#36BCF7"/>
      <line x1="0" y1="-12" x2="0" y2="-20" stroke="#8b949e" stroke-width="2"/>
      <path d="M-11 4 L-18 16 M11 4 L18 16" stroke="#8b949e" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="45" fill="#8b949e" font-size="12" text-anchor="middle">UAV-01</text>
  </g>

  <!-- ===== Veri paketleri: yol boyunca akar =====
       Negatif begin = animasyon "çoktan başlamış" gibi davranır, böylece paketler arka arkaya dizilir. -->
  <g font-size="11" text-anchor="middle">
    <g><animateMotion dur="3.2s" begin="0s" repeatCount="indefinite"><mpath href="#link"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="0s" repeatCount="indefinite"/>
      <rect x="-22" y="-10" width="44" height="18" rx="4" fill="#0d1117" stroke="#36BCF7"/><text y="3" fill="#36BCF7">GPS</text></g>
    <g><animateMotion dur="3.2s" begin="-0.8s" repeatCount="indefinite"><mpath href="#link"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="-0.8s" repeatCount="indefinite"/>
      <rect x="-22" y="-10" width="44" height="18" rx="4" fill="#0d1117" stroke="#3fb950"/><text y="3" fill="#3fb950">IMU</text></g>
    <g><animateMotion dur="3.2s" begin="-1.6s" repeatCount="indefinite"><mpath href="#link"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
      <rect x="-22" y="-10" width="44" height="18" rx="4" fill="#0d1117" stroke="#d29922"/><text y="3" fill="#d29922">ALT</text></g>
    <g><animateMotion dur="3.2s" begin="-2.4s" repeatCount="indefinite"><mpath href="#link"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="-2.4s" repeatCount="indefinite"/>
      <rect x="-22" y="-10" width="44" height="18" rx="4" fill="#0d1117" stroke="#ff4d4d"/><text y="3" fill="#ff4d4d">BAT</text></g>
  </g>

  <!-- ===== Yer istasyonu / sunucu (sağ) ===== -->
  <g transform="translate(680 40)">
    <rect x="0" y="0" width="70" height="88" rx="6" fill="#161b22" stroke="#8b949e"/>
    <g fill="#30363d"><rect x="8" y="10" width="54" height="16" rx="3"/><rect x="8" y="36" width="54" height="16" rx="3"/><rect x="8" y="62" width="54" height="16" rx="3"/></g>
    <!-- Paket geldikçe yanıp sönen LED'ler -->
    <circle cx="52" cy="18" r="3" fill="#3fb950"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="52" cy="44" r="3" fill="#36BCF7"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="52" cy="70" r="3" fill="#d29922"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <g fill="#8b949e"><rect x="14" y="16" width="26" height="4" rx="2"/><rect x="14" y="42" width="26" height="4" rx="2"/><rect x="14" y="68" width="26" height="4" rx="2"/></g>
    <text x="35" y="106" fill="#8b949e" font-size="12" text-anchor="middle">YER İSTASYONU</text>
  </g>

  <!-- ===== Alt şerit: sola kayan ikili veri akışı ===== -->
  <g clip-path="url(#strip)" fill="#3fb950" fill-opacity="0.35" font-size="12">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="16s" repeatCount="indefinite"/>
      <text x="0" y="160">01001101 01000001 01010110 00110001 11001010 01110100 00101101 10110011 01011100 11100001</text>
      <text x="800" y="160">01001101 01000001 01010110 00110001 11001010 01110100 00101101 10110011 01011100 11100001</text>
    </g>
  </g>
</svg>
