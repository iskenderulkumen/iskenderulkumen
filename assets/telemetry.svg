<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="230" viewBox="0 0 800 230" font-family="monospace">
  <defs>
    <!-- GLOW: şekli bulanıklaştırıp orijinalin altına koyar → neon parlama -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010d"/>
      <stop offset="0.57" stop-color="#2a0845"/>
      <stop offset="0.58" stop-color="#0a0118"/>
      <stop offset="1" stop-color="#05010d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe600"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <!-- Güneşin alt yarısındaki çizgiler: maske siyah olan yerleri gizler -->
    <mask id="sunStripes">
      <rect x="300" y="40" width="200" height="100" fill="#fff"/>
      <g fill="#000">
        <rect x="300" y="92" width="200" height="2"/>
        <rect x="300" y="102" width="200" height="3"/>
        <rect x="300" y="111" width="200" height="4"/>
        <rect x="300" y="120" width="200" height="5"/>
      </g>
    </mask>
    <clipPath id="panel"><rect width="800" height="230" rx="14"/></clipPath>
    <clipPath id="aboveHorizon"><rect x="0" y="0" width="800" height="130"/></clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="800" height="230" fill="url(#sky)"/>

    <!-- ===== Synthwave güneşi ===== -->
    <g clip-path="url(#aboveHorizon)" filter="url(#glow2)">
      <circle cx="400" cy="130" r="68" fill="url(#sun)" mask="url(#sunStripes)"/>
    </g>

    <!-- ===== Perspektif ızgara zemin ===== -->
    <g stroke="#ff2bd6" stroke-width="1.2" filter="url(#glow)">
      <!-- Ufuk çizgisi -->
      <line x1="0" y1="130" x2="800" y2="130" stroke-width="2"/>
      <!-- Ortadaki kaçış noktasından yayılan çizgiler -->
      <g stroke-opacity="0.55">
        <line x1="400" y1="130" x2="-370" y2="230"/><line x1="400" y1="130" x2="-260" y2="230"/>
        <line x1="400" y1="130" x2="-150" y2="230"/><line x1="400" y1="130" x2="-40" y2="230"/>
        <line x1="400" y1="130" x2="70" y2="230"/><line x1="400" y1="130" x2="180" y2="230"/>
        <line x1="400" y1="130" x2="290" y2="230"/><line x1="400" y1="130" x2="400" y2="230"/>
        <line x1="400" y1="130" x2="510" y2="230"/><line x1="400" y1="130" x2="620" y2="230"/>
        <line x1="400" y1="130" x2="730" y2="230"/><line x1="400" y1="130" x2="840" y2="230"/>
        <line x1="400" y1="130" x2="950" y2="230"/><line x1="400" y1="130" x2="1060" y2="230"/>
        <line x1="400" y1="130" x2="1170" y2="230"/>
      </g>
      <!-- Yatay çizgiler: ufuktan bize doğru hızlanarak gelir → ileri uçuyormuş hissi -->
      <g>
        <line x1="0" x2="800" y1="130" y2="130"><animate attributeName="y1" values="130;230" dur="2.4s" begin="0s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="130;230" dur="2.4s" begin="0s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/></line>
        <line x1="0" x2="800" y1="130" y2="130"><animate attributeName="y1" values="130;230" dur="2.4s" begin="-0.4s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="130;230" dur="2.4s" begin="-0.4s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/></line>
        <line x1="0" x2="800" y1="130" y2="130"><animate attributeName="y1" values="130;230" dur="2.4s" begin="-0.8s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="130;230" dur="2.4s" begin="-0.8s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/></line>
        <line x1="0" x2="800" y1="130" y2="130"><animate attributeName="y1" values="130;230" dur="2.4s" begin="-1.2s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="130;230" dur="2.4s" begin="-1.2s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/></line>
        <line x1="0" x2="800" y1="130" y2="130"><animate attributeName="y1" values="130;230" dur="2.4s" begin="-1.6s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="130;230" dur="2.4s" begin="-1.6s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/></line>
        <line x1="0" x2="800" y1="130" y2="130"><animate attributeName="y1" values="130;230" dur="2.4s" begin="-2.0s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="130;230" dur="2.4s" begin="-2.0s" calcMode="spline" keySplines="0.6 0 1 1" repeatCount="indefinite"/></line>
      </g>
    </g>

    <!-- ===== Veri ışını: drone → kule ===== -->
    <path id="link" d="M178 62 Q420 -15 652 44" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="6" filter="url(#glow2)"/>
    <path d="M178 62 Q420 -15 652 44" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="10 6" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="0.6s" repeatCount="indefinite"/>
    </path>

    <!-- Paketler: negatif begin ile arka arkaya dizilirler -->
    <g font-size="11" font-weight="bold" text-anchor="middle" filter="url(#glow)">
      <g><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite"><mpath href="#link" xlink:href="#link"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.5s" begin="0s" repeatCount="indefinite"/>
        <rect x="-20" y="-10" width="40" height="17" fill="#0a0118" stroke="#00f0ff"/><text y="3" fill="#00f0ff">0x4F</text></g>
      <g><animateMotion dur="3.5s" begin="-0.7s" repeatCount="indefinite"><mpath href="#link" xlink:href="#link"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.5s" begin="-0.7s" repeatCount="indefinite"/>
        <rect x="-20" y="-10" width="40" height="17" fill="#0a0118" stroke="#ff2bd6"/><text y="3" fill="#ff2bd6">GPS</text></g>
      <g><animateMotion dur="3.5s" begin="-1.4s" repeatCount="indefinite"><mpath href="#link" xlink:href="#link"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.5s" begin="-1.4s" repeatCount="indefinite"/>
        <rect x="-20" y="-10" width="40" height="17" fill="#0a0118" stroke="#ffe600"/><text y="3" fill="#ffe600">IMU</text></g>
      <g><animateMotion dur="3.5s" begin="-2.1s" repeatCount="indefinite"><mpath href="#link" xlink:href="#link"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.5s" begin="-2.1s" repeatCount="indefinite"/>
        <rect x="-20" y="-10" width="40" height="17" fill="#0a0118" stroke="#00f0ff"/><text y="3" fill="#00f0ff">0xA1</text></g>
      <g><animateMotion dur="3.5s" begin="-2.8s" repeatCount="indefinite"><mpath href="#link" xlink:href="#link"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.5s" begin="-2.8s" repeatCount="indefinite"/>
        <rect x="-20" y="-10" width="40" height="17" fill="#0a0118" stroke="#ff2bd6"/><text y="3" fill="#ff2bd6">ALT</text></g>
    </g>

    <!-- ===== Neon drone (sol) ===== -->
    <g transform="translate(150 72)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="1.8s" repeatCount="indefinite"/>
        <g fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)">
          <ellipse cx="-40" cy="-14" rx="20" ry="3" stroke="#ff2bd6"><animate attributeName="rx" values="20;3;20" dur="0.12s" repeatCount="indefinite"/></ellipse>
          <ellipse cx="40" cy="-14" rx="20" ry="3" stroke="#ff2bd6"><animate attributeName="rx" values="3;20;3" dur="0.12s" repeatCount="indefinite"/></ellipse>
          <line x1="-40" y1="-12" x2="-40" y2="-5"/><line x1="40" y1="-12" x2="40" y2="-5"/>
          <line x1="-44" y1="-5" x2="44" y2="-5"/>
          <rect x="-16" y="-12" width="32" height="16" rx="5" fill="#0a0118"/>
          <path d="M-11 4 L-18 16 M11 4 L18 16" stroke-linecap="round"/>
        </g>
        <!-- Kamera gözü: nefes alır gibi parlar -->
        <circle cx="0" cy="-4" r="3.5" fill="#ff2bd6" filter="url(#glow2)"><animate attributeName="r" values="2.5;4.5;2.5" dur="1.2s" repeatCount="indefinite"/></circle>
      </g>
      <text x="0" y="44" fill="#00f0ff" font-size="11" text-anchor="middle" filter="url(#glow)">UAV-01</text>
    </g>

    <!-- ===== Neon anten kulesi (sağ) ===== -->
    <g fill="none" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow)">
      <path d="M640 130 L660 44 L680 130 M644 112 L676 112 M649 90 L671 90 M654 68 L666 68 M644 112 L671 90 M676 112 L649 90 M649 90 L666 68 M671 90 L654 68"/>
      <circle cx="660" cy="44" r="5" stroke="#ff2bd6"><animate attributeName="r" values="5;30" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="44" r="5" stroke="#ff2bd6"><animate attributeName="r" values="5;30" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/></circle>
    </g>
    <circle cx="660" cy="42" r="3" fill="#ff2bd6" filter="url(#glow2)"><animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/></circle>

    <!-- ===== Glitch başlık: 3 katman, pembe ve camgöbeği katmanlar ara sıra kayar ===== -->
    <g font-size="15" font-weight="bold">
      <text x="24" y="30" fill="#ff2bd6" opacity="0.8">UPLINK://UAV-01
        <animateTransform attributeName="transform" type="translate" values="0 0;-4 1;3 0;0 0;0 0" keyTimes="0;0.86;0.9;0.94;1" calcMode="discrete" dur="3.5s" repeatCount="indefinite"/></text>
      <text x="24" y="30" fill="#00f0ff" opacity="0.8">UPLINK://UAV-01
        <animateTransform attributeName="transform" type="translate" values="0 0;4 -1;-2 0;0 0;0 0" keyTimes="0;0.86;0.9;0.94;1" calcMode="discrete" dur="3.5s" repeatCount="indefinite"/></text>
      <text x="24" y="30" fill="#ffffff">UPLINK://UAV-01</text>
    </g>
    <g font-size="11" text-anchor="end" filter="url(#glow)">
      <text x="776" y="28" fill="#00f0ff">SİNYAL 92% ▮▮▮▮▯</text>
      <text x="776" y="44" fill="#ff2bd6">● AKTARIM<animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/></text>
    </g>
  </g>
</svg>
